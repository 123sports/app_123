project_id = "123sports-local"

[auth]
enabled = true
site_url = "https://app-123-fx8f.onrender.com"
additional_redirect_urls = [
  "https://app-123-fx8f.onrender.com/**",
  "http://127.0.0.1:4173/**",
  "http://localhost:4173/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false
minimum_password_length = 8
password_requirements = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
