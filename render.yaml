services:
  - type: web
    name: app-123
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: VITE_ENABLE_LOCAL_MODE
        value: "false"
      - key: VITE_ENABLE_GOOGLE_AUTH
        value: "false"
      - key: VITE_TURNSTILE_SITE_KEY
        sync: false
      - key: VITE_PAYMENT_PROVIDER
        value: mercado_pago
      - key: APP_BASE_URL
        value: https://app.olimpioneto.com.br
      - key: PAYMENT_PROVIDER
        value: mercado_pago
      - key: ALLOW_LOCAL_PAYMENT_SIMULATION
        value: "false"
      - key: MERCADO_PAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADO_PAGO_WEBHOOK_SECRET
        sync: false
      - key: MERCADO_PAGO_ENVIRONMENT
        value: production
      - key: ENABLE_TEST_BOOKING_TYPE
        value: "false"
      - key: VITE_ENABLE_TEST_BOOKING_TYPE
        value: "false"
